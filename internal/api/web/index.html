<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SyncAmp</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="bg" aria-hidden="true"></div>
<main>
  <header class="hero glass">
    <div id="ring" class="ring unknown" aria-hidden="true"><span id="glyph">·</span></div>
    <div class="hero-text">
      <h1 id="headline">SyncAmp</h1>
      <p id="subline" class="muted">Connecting…</p>
    </div>
  </header>

  <section id="login" class="glass card" hidden>
    <h2>Sign in</h2>
    <p class="muted small">Paste the API token. On the server, run <code>syncamp token</code> (administrator / owner only).</p>
    <div class="row-inline">
      <input id="token" type="password" autocomplete="off" placeholder="API token" aria-label="API token">
      <button id="signin" class="btn primary">Sign in</button>
    </div>
    <p id="loginerr" class="small bad"></p>
  </section>

  <div id="app" hidden>
    <ul id="notices" class="notices"></ul>

    <h2 class="section">Backups</h2>
    <ul id="profiles" class="list glass"></ul>

    <div class="actions">
      <button id="runall" class="btn primary">Back up all now</button>
      <button id="reload" class="btn">Rescan</button>
      <button id="signout" class="btn ghost">Sign out</button>
    </div>

    <h2 class="section">Activity</h2>
    <ul id="history" class="list glass"></ul>
    <p id="meta" class="muted small foot"></p>
  </div>
</main>
<script src="/app.js"></script></body></html>
