<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SyncAmp</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="bg" aria-hidden="true"></div>
<main class="panel glass">

  <header class="top">
    <div id="ring" class="ring unknown" aria-hidden="true"><span id="glyph">·</span></div>
    <div class="top-text">
      <h1 id="headline">SyncAmp</h1>
      <p id="subline" class="muted">Connecting…</p>
    </div>
    <div class="top-actions" id="topactions" hidden>
      <button id="reload" class="icon" title="Rescan profiles" aria-label="Rescan profiles">↻</button>
      <button id="signout" class="icon" title="Sign out" aria-label="Sign out">⏻</button>
    </div>
  </header>

  <section id="login" hidden>
    <hr>
    <h2>Sign in</h2>
    <p class="sub">Paste the API token. On the server run <code>syncamp token</code> (administrator / owner only).</p>
    <div class="field">
      <input id="token" type="password" autocomplete="off" placeholder="API token" aria-label="API token">
      <button id="signin" class="btn primary">Sign in</button>
    </div>
    <p id="loginerr" class="sub bad"></p>
  </section>

  <div id="app" hidden>
    <ul id="notices" class="notices"></ul>
    <hr>
    <h2>Backups</h2>
    <p id="backupsSub" class="sub">Select a backup</p>
    <ul id="profiles" class="well"></ul>
    <hr>
    <h2>Activity</h2>
    <p class="sub">Most recent runs</p>
    <ul id="history" class="well compact"></ul>
    <button id="runall" class="btn primary wide">Back up all now</button>
    <p id="meta" class="sub foot"></p>
  </div>
</main>
<script src="/app.js"></script></body></html>
