<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyncAmp</title><link rel="stylesheet" href="/style.css"></head><body><main>
<h1>SyncAmp <span id="overall" class="pill">…</span></h1>
<div class="card" id="login" hidden>
  <h2>Sign in</h2>
  <p class="mut">Paste the API token. Print it on the server with <code>syncamp token</code> (administrator/root only).</p>
  <input id="token" type="password" autocomplete="off" placeholder="API token"> <button id="signin">Sign in</button>
  <div id="loginerr" class="mut"></div>
</div>
<div id="app" hidden>
  <div class="card"><div id="summary"></div><div class="mut" id="meta"></div><ul id="findings"></ul></div>
  <div class="card"><h2>Profiles</h2><table id="profiles"></table>
  <p><button id="runall">Run all now</button> <button id="reload">Rescan profiles</button> <button id="signout">Sign out</button></p></div>
  <div class="card"><h2>Recent runs</h2><table id="history"></table></div>
</div>
</main><script src="/app.js"></script></body></html>
