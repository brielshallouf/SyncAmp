name: build
# Reusable: tests, builds every platform, scans the binaries, uploads them as artifacts.
# Called by release.yml (tags) and nightly.yml (pushes).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test and build all platforms
        run: make dist
      - name: Scan the shipped binaries for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for b in dist/syncamp-*; do
            case "$b" in *SHA256SUMS) continue;; esac
            echo "== $b"; "$(go env GOPATH)/bin/govulncheck" -mode=binary "$b"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncamp-binaries
          path: dist/*
          retention-days: 30

  # ONE installer for Windows: service + app + autostart. It is built here and then really
  # installed, exercised and uninstalled on this Windows machine, so a broken installer can
  # never be published.
  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: syncamp-binaries
          path: dist
      - name: Build SyncAmp-Setup.exe
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $c = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"; if (Test-Path $c) { $iscc = $c } }
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          Write-Host "Inno Setup: $iscc"
          $ver = (git describe --tags --always)
          & $iscc "/DAppVersion=$ver" installer\windows\SyncAmp.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-Item dist\SyncAmp-Setup.exe | Format-List Name, Length
      - name: Smoke-test - install, run the service and the app window, uninstall
        shell: pwsh
        run: ./installer/windows/smoke-test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncamp-installer
          path: dist/SyncAmp-Setup.exe
          retention-days: 30

  # The SwiftUI menu-bar app. A failure here must not block the Windows/Linux builds;
  # if the Mac zip is missing from a release, read this job's log.
  macos-app:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the universal background service to bundle inside the app
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/syncamp-arm64" ./cmd/syncamp
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/syncamp-amd64" ./cmd/syncamp
          lipo -create -output "$RUNNER_TEMP/syncamp" "$RUNNER_TEMP/syncamp-arm64" "$RUNNER_TEMP/syncamp-amd64"
          lipo -info "$RUNNER_TEMP/syncamp"
      - name: Build SyncAmp.app (runs the Swift unit tests first)
        working-directory: macos
        env:
          SYNCAMP_BIN: ${{ runner.temp }}/syncamp
        run: ./build-app.sh
      - name: Zip the app
        working-directory: macos/dist
        run: ditto -c -k --keepParent SyncAmp.app SyncAmp-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncamp-macos-app
          path: macos/dist/SyncAmp-macos.zip
          retention-days: 30
