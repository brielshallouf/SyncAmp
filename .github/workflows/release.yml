name: release
# Push a tag like v0.1.0 to build everything and publish a GitHub Release with the
# .exe files attached. You can also run it by hand from the Actions tab (it then
# only produces downloadable build artifacts, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test and build all platforms
        run: make dist VERSION="${{ github.ref_name }}"
      - name: Scan the shipped binaries for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for b in dist/syncamp-*; do
            case "$b" in *SHA256SUMS) continue;; esac
            echo "== $b"; "$(go env GOPATH)/bin/govulncheck" -mode=binary "$b"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncamp-binaries
          path: dist/*
          retention-days: 30

  # Builds the SwiftUI menu-bar app. It has never been compiled yet, so a failure here
  # must not block the Windows/Linux release; check this job's log if the Mac app is missing.
  macos-app:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build SyncAmp.app (runs the Swift unit tests first)
        working-directory: macos
        run: ./build-app.sh
      - name: Zip the app
        working-directory: macos/dist
        run: ditto -c -k --keepParent SyncAmp.app SyncAmp-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncamp-macos-app
          path: macos/dist/SyncAmp-macos.zip
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: syncamp-binaries
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true   # absent if the Mac build failed
        with:
          name: syncamp-macos-app
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release && rm -f SHA256SUMS && sha256sum * > SHA256SUMS && cd ..
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
