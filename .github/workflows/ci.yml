name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories can appear without any code change
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go test ./...
        if: runner.os == 'Windows'
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
      - name: govulncheck on shipped binaries
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for b in dist/syncamp-linux-amd64 dist/syncamp-windows-amd64.exe dist/syncamp-tray-linux-amd64; do govulncheck -mode=binary "$b"; done
